# Dépendances de DÉVELOPPEMENT uniquement. Ports décalés et isolés :
# rien ici ne parle au Mosquitto ni aux appareils de production (AGENTS.md §4.2).
name: rusthome-dev
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["127.0.0.1:1884:1883"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  ntfy:
    image: binwiederhier/ntfy
    command: serve
    ports: ["127.0.0.1:8090:80"]
  # ESPHome Builder (même version que l'add-on de HA) : compile, OTA et
  # logs, piloté par RustHome via /ws (spec §5.3 bis). Port publié en local
  # seulement. Données dans var/esphome (ignoré par git) : sans les projets
  # de l'alarme, et avec des secrets factices.
  esphome:
    image: ghcr.io/esphome/esphome:2026.9.1
    ports: ["127.0.0.1:6052:6052"]
    volumes:
      - ../../var/esphome:/config
      - esphome-cache:/cache
    environment:
      PLATFORMIO_CORE_DIR: /cache/platformio
volumes:
  esphome-cache:
