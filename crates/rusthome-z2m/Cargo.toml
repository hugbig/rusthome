[package]
name = "rusthome-z2m"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3.34"
rusthome-core = { version = "0.1.0", path = "../rusthome-core" }
rusthome-model = { version = "0.1.0", path = "../rusthome-model" }
rusthome-mqtt = { version = "0.1.0", path = "../rusthome-mqtt" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["full"] }
