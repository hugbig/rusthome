[package]
name = "rusthome-esphome"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["time", "rt", "macros", "sync", "net"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["full"] }
