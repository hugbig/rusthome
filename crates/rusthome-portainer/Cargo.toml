[package]
name = "rusthome-portainer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
rusthome-core = { version = "0.1.0", path = "../rusthome-core" }
rusthome-model = { version = "0.1.0", path = "../rusthome-model" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["time", "rt", "macros"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
dotenvy = "0.15.7"
tokio = { version = "1.53.3", features = ["full"] }
wiremock = "0.6.5"
