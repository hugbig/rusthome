[package]
name = "rusthome-mqtt"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
futures-util = "0.3.34"
rumqttc = "0.25.1"
rusthome-core = { version = "0.1.0", path = "../rusthome-core" }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
dotenvy = "0.15.7"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
