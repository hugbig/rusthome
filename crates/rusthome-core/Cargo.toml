[package]
name = "rusthome-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = "0.4.45"
dashmap = "6.2.1"
futures-util = "0.3.34"
rusthome-model = { version = "0.1.0", path = "../rusthome-model" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["full"] }
