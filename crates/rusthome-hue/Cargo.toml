[package]
name = "rusthome-hue"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = "0.4.45"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rusthome-core = { version = "0.1.0", path = "../rusthome-core" }
rusthome-model = { version = "0.1.0", path = "../rusthome-model" }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["time", "rt", "macros"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["full"] }
wiremock = "0.6.5"
