[package]
name = "rusthome-ha-bridge"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
futures-util = "0.3.34"
rusthome-core = { version = "0.1.0", path = "../rusthome-core" }
rusthome-import = { version = "0.1.0", path = "../rusthome-import" }
rusthome-model = { version = "0.1.0", path = "../rusthome-model" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "macros", "time", "net", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["full"] }
