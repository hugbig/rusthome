[package]
name = "rusthome-automation"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
futures-util = "0.3.34"
rusthome-core = { version = "0.1.0", path = "../rusthome-core" }
rusthome-model = { version = "0.1.0", path = "../rusthome-model" }
rusthome-template = { version = "0.1.0", path = "../rusthome-template" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml = "0.9.34"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1.44"

[dev-dependencies]
rusthome-core = { path = "../rusthome-core" }
tokio = { version = "1.53.3", features = ["full", "test-util"] }
