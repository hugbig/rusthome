[package]
name = "rusthome-api"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
futures-util = "0.3.34"
openidconnect = "4.0.1"
rusthome-automation = { version = "0.1.0", path = "../rusthome-automation" }
rusthome-core = { version = "0.1.0", path = "../rusthome-core" }
rusthome-ha-bridge = { version = "0.1.0", path = "../rusthome-ha-bridge" }
rusthome-model = { version = "0.1.0", path = "../rusthome-model" }
rusthome-recorder = { version = "0.1.0", path = "../rusthome-recorder" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "macros", "net"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "fs"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.53.3", features = ["full"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
url = "2.5.8"
