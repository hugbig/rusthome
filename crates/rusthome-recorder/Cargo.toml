[package]
name = "rusthome-recorder"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = "0.4.45"
rusthome-core = { version = "0.1.0", path = "../rusthome-core" }
rusthome-model = { version = "0.1.0", path = "../rusthome-model" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["full"] }
